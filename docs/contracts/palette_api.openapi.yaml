openapi: 3.1.0
info:
  title: Bluethumb Art Nano — Palette Service API
  version: 0.2.0
  description: Colour extraction and CIELAB ranking. Colour math lives in apps/palette only.
servers:
  - url: http://localhost:9292
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /colour/extract:
    post:
      summary: Extract and store the palette for an artwork
      description: >-
        Send JSON naming the artwork when this service can read the same files
        Rails wrote. Send multipart with the image when it cannot - separate
        filesystems, object storage, or a one-off re-extraction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artwork_id]
              properties:
                artwork_id:
                  type: integer
                force:
                  type: boolean
                  default: false
          multipart/form-data:
            schema:
              type: object
              required: [artwork_id, image]
              properties:
                artwork_id:
                  type: integer
                force:
                  type: boolean
                image:
                  type: string
                  format: binary
                  description: PNG, JPEG or WebP, up to 8MB.
      responses:
        "200":
          description: Palette extracted and stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  artwork_id: { type: integer }
                  source:
                    type: string
                    enum: [upload, disk]
                    description: Where the bytes came from.
                  palette: { type: object }
        "404":
          description: No image found for that artwork on this service's disk
        "422":
          description: Invalid params, or an image this service will not accept
        "501":
          description: Extraction unavailable for this image
  /colour/similar/{artwork_id}:
    get:
      summary: Similar artworks by palette, ranked in CIELAB
      parameters:
        - name: artwork_id
          in: path
          required: true
          schema:
            type: integer
        - name: hex
          in: query
          required: false
          description: >-
            Seed colour to rank against, with or without the leading hash.
            Omitted, the artwork's own palette centroid is the seed.
          schema:
            type: string
            pattern: "^#?[0-9a-fA-F]{6}$"
          example: "3366cc"
      responses:
        "200":
          description: Ranked similar artworks, closest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  artworks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        distance: { type: number }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
                      query_ms: { type: integer }
                      seed:
                        type: object
                        description: >-
                          { artwork_id } when ranking against the artwork's own
                          centroid, { hex, lab } when a seed colour was given.
        "422":
          description: Malformed seed colour
  /colour/match-room:
    post:
      summary: Rank artworks by room photo palette
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Room palette plus ranked artworks
          content:
            application/json:
              schema:
                type: object
                properties:
                  artworks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        distance: { type: number }
                  palette:
                    type: object
                    properties:
                      hue_family: { type: string }
                      centroid:
                        type: object
                        properties:
                          l: { type: number }
                          a: { type: number }
                          b: { type: number }
                      swatches:
                        type: array
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
                      query_ms: { type: integer }
        "422":
          description: Missing or invalid image / extract failure
