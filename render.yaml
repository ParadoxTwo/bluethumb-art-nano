# Render Blueprint for Bluethumb Art Nano.
#
# Two web services sharing one Postgres, mirroring the code boundary: Rails
# owns HTML, sessions and the catalogue; Hanami owns colour maths. Rails calls
# the palette service over its public HTTPS address because free web services
# can send but not receive private-network traffic on Render.
#
# Free-tier facts this file is shaped around:
#   * Free services spin down after 15 idle minutes and their disk resets on
#     every deploy, restart and spin-down. Artwork images are therefore
#     generated during the build so they ship inside the deploy image.
#   * Free Postgres expires 30 days after creation (14-day grace, then deleted).
#   * preDeployCommand is paid-only, so migrations run in the build command.
#
# After the first deploy, confirm the palette service's actual hostname in the
# dashboard and update PALETTE_SERVICE_URL if Render had to suffix the name.

databases:
  - name: bluethumb-nano-db
    plan: free
    region: singapore
    databaseName: bluethumb_art_nano
    postgresMajorVersion: "16"

services:
  - type: web
    name: bluethumb-nano-palette
    runtime: ruby
    plan: free
    region: singapore
    rootDir: apps/palette
    buildCommand: bin/render-build
    startCommand: HANAMI_ENV=production HANAMI_PORT=$PORT bundle exec puma -C config/puma.rb
    healthCheckPath: /health
    envVars:
      - key: HANAMI_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bluethumb-nano-db
          property: connectionString

  - type: web
    name: bluethumb-nano
    runtime: ruby
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: bin/render-build
    startCommand: bin/rails server
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bluethumb-nano-db
          property: connectionString
      - key: PALETTE_SERVICE_URL
        value: https://bluethumb-nano-palette.onrender.com
      # One Puma worker: the free instance has 512 MB and Rails 8 preloads.
      - key: WEB_CONCURRENCY
        value: "1"
      # Catalogue size generated at build time. ~150 keeps the build to a few
      # minutes; every artwork gets a full-size PNG plus a detail image.
      - key: SEED_ARTIST_COUNT
        value: "20"
      - key: SEED_ARTWORK_COUNT
        value: "150"
